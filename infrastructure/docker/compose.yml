# 开发基础设施；应用独立启动。已有授权远端 PostgreSQL 时直接复用，避免端口冲突。
name: enterprise-agent-p0
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eap_p0}
      POSTGRES_USER: ${POSTGRES_USER:-eap_p0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in local .env}
    # 默认回环暴露；容器内数据库端口保持5432，宿主端口由环境决定。
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 数据库可接收连接不表示 Flyway 或整个业务链路已验收。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Java 分布式锁依赖；仅开发单节点，不承诺 Redis 故障切换下锁永不丢失。
  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in local .env}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
  # 仅可选环境预留，默认不启动；尚未实现 Artifact 的存取授权。
  minio:
    profiles: [storage]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eap-p0}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-p0-development-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  redis-data:
  minio-data:
