server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        return 404;
    }
}
