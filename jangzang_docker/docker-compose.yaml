name: jangzang

services:
  frontend:
    image: jangzang/frontend:${JANGZANG_IMAGE_TAG:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: jangzang/backend:${JANGZANG_IMAGE_TAG:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      runtime:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18081}:8080"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-eap_p0}
      POSTGRES_USER: ${POSTGRES_USER:-eap_p0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis://host.docker.internal:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      RUNTIME_URL: http://runtime:8000
    networks:
      - edge
      - execution
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  runtime:
    image: jangzang/runtime:${JANGZANG_IMAGE_TAG:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-p0-deterministic}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
    volumes:
      - runtime-data:/var/lib/agent-runtime
    networks:
      - execution
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

networks:
  edge:
  execution:

volumes:
  runtime-data:
