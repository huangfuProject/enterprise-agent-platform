[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["deepagents==0.7.28", "langgraph==1.2.16", "langgraph-checkpoint-sqlite", "fastapi", "uvicorn", "httpx", "langchain-openai"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "jsonschema", "psycopg[binary]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_model: requires explicitly configured real model"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
