# 默认仅绑定本机；此 PoC 没有生产身份认证和服务间授权。
server:
  address: ${API_BIND_ADDRESS:127.0.0.1}
  port: ${API_PORT:8080}
spring:
  # 数据库连接与读取有界；密码只由环境注入，不在受版本控制的配置中保存。
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eap_p0}?connectTimeout=5&socketTimeout=10
    username: ${POSTGRES_USER:eap_p0}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 8
  # 与 Python v1 Schema 保持字段命名一致，并拒绝不认识的输入字段。
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  # 已执行迁移是历史事实，后续 Schema 变化应追加版本而不是编辑旧文件。
  flyway:
    enabled: true
# XML 保留 PostgreSQL 原子领取与租约 SQL；普通操作使用 MyBatis-Plus BaseMapper。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 版本和运行快照必须重新访问数据库，不能复用旧状态。
    local-cache-scope: statement
    cache-enabled: false
  global-config:
    banner: false
management:
  endpoints:
    web:
      exposure:
        include: health
# HTTP 时限是单次通信边界，lease 是控制平面失联边界，二者不能当作 Agent 完成状态。
p0:
  runtime-url: ${RUNTIME_URL:http://127.0.0.1:8000}
  lease-seconds: ${LEASE_SECONDS:15}
  dispatch-ms: ${DISPATCH_MS:500}
  http-timeout-ms: ${RUNTIME_HTTP_TIMEOUT_MS:2000}
  scheduler-enabled: ${SCHEDULER_ENABLED:true}

  # Redis 锁只覆盖短数据库事务；任务运行期间不持有锁。
  lock:
    address: ${REDIS_ADDRESS:redis://127.0.0.1:56379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    key-prefix: ${LOCK_KEY_PREFIX:enterprise-agent:${POSTGRES_DB:eap_p0}:lock:}
    watchdog-timeout-ms: ${LOCK_WATCHDOG_TIMEOUT_MS:30000}
    wait-ms: ${LOCK_WAIT_MS:1000}
