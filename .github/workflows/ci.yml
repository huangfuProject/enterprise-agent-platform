# P0 分层验证；真实模型凭证不进入公共 CI，live 测试默认跳过。
name: P0 verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    # 每个 CI job 使用独立的临时数据库服务，与开发测试库隔离。
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: eap_p0_test
          POSTGRES_USER: eap_p0
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U eap_p0 -d eap_p0_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: eap_p0_test
      POSTGRES_USER: eap_p0
      POSTGRES_PASSWORD: ci-only-disposable
      MAVEN_BIN: mvn
      MAVEN_SETTINGS: /tmp/eap-maven-settings.xml
      RUNTIME_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: |
          printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>' > /tmp/eap-maven-settings.xml
          pip install -r apps/agent-runtime/requirements.lock
          pip install --no-deps -e apps/agent-runtime
          npm --prefix apps/web ci --no-audit --no-fund
          python -c "import os; from pathlib import Path; Path('.env').write_text(''.join(f'{k}={v}\n' for k,v in os.environ.items() if k.startswith('POSTGRES_')))"
      # 基础验证成功后再进入数据库与跨进程故障测试。
      - run: ./scripts/test.sh
      - run: ./scripts/test-integration.sh
